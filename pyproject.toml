[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajlens"
version = "0.1.0"
description = "Read coding-agent trajectories, measure behaviour, classify failures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vipul Raj Jha" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "html5lib>=1.1", "hypothesis>=6"]

[project.scripts]
trajlens = "trajlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trajlens"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["trajlens"]
